  <style>
    @font-face {
      font-family: "Fraunces";
      src: url("assets/assets/fonts/Fraunces-Medium.ttf") format("truetype");
      font-weight: 500;
      font-display: swap;
    }
    @font-face {
      font-family: "JetBrains Mono";
      src: url("assets/assets/fonts/JetBrainsMono-Medium.ttf") format("truetype");
      font-weight: 500;
      font-display: swap;
    }
    @font-face {
      font-family: "Figtree";
      src: url("assets/assets/fonts/Figtree-Regular.ttf") format("truetype");
      font-weight: 400;
      font-display: swap;
    }

    :root {
      --paper: #F6F5F1;
      --ink: #14171A;
      --ink-muted: #454D55;
      --line: #DDD9CF;
      --accent: #0B6B61;
    }

    html, body {
      margin: 0;
      padding: 0;
      width: 100%;
      height: 100%;
      background: var(--paper);
      color: var(--ink);
      overflow: hidden;
      -webkit-text-size-adjust: 100%;
    }

    flutter-view, flt-glass-pane, canvas {
      width: 100% !important;
      height: 100% !important;
    }

    #splash {
      position: fixed;
      inset: 0;
      z-index: 9999;
      display: flex;
      align-items: center;
      justify-content: center;
      background: var(--paper);
      transition: opacity 320ms ease, visibility 320ms ease;
    }

    #splash.is-done {
      opacity: 0;
      visibility: hidden;
      pointer-events: none;
    }

    .splash-inner {
      width: min(420px, calc(100vw - 48px));
      animation: splash-rise 520ms cubic-bezier(0.22, 1, 0.36, 1) both;
    }

    .splash-eyebrow {
      margin: 0 0 14px;
      font: 500 12px/1.4 "JetBrains Mono", ui-monospace, SFMono-Regular, Menlo, monospace;
      letter-spacing: 0.09em;
      text-transform: uppercase;
      color: var(--accent);
    }

    .splash-name {
      margin: 0;
      font: 500 clamp(34px, 8vw, 48px)/1.05 "Fraunces", Georgia, "Times New Roman", serif;
      letter-spacing: -0.025em;
      color: var(--ink);
    }

    .splash-track {
      position: relative;
      height: 1px;
      margin-top: 28px;
      background: var(--line);
      overflow: hidden;
    }

    .splash-bar {
      position: absolute;
      inset: 0 auto 0 0;
      width: 30%;
      height: 1.5px;
      background: var(--accent);
      animation: splash-slide 1.2s cubic-bezier(0.45, 0.05, 0.55, 0.95) infinite;
    }

    @keyframes splash-rise {
      from { opacity: 0; transform: translateY(8px); }
      to { opacity: 1; transform: none; }
    }

    @keyframes splash-slide {
      from { transform: translateX(-100%); }
      to { transform: translateX(340%); }
    }

    @media (prefers-reduced-motion: reduce) {
      .splash-inner, .splash-bar { animation: none; }
      .splash-bar { width: 100%; opacity: 0.35; }
      #splash { transition: none; }
    }

    .noscript {
      max-width: 680px;
      margin: 0 auto;
      padding: 72px 24px;
      font: 400 17px/1.6 "Figtree", system-ui, sans-serif;
      color: var(--ink-muted);
    }
    .noscript h1 {
      font: 500 40px/1.1 "Fraunces", Georgia, serif;
      color: var(--ink);
      margin: 0 0 16px;
    }
    .noscript a { color: var(--accent); }
  </style>
</head>
<body>
  <noscript>
    <style>#splash { display: none; } html, body { overflow: auto; }</style>
    <main class="noscript">
      <h1>Tushar Dubey</h1>
      <p>Flutter engineer in Mumbai, India, with 8+ years of experience shipping production Android, iOS and web apps.
        At Spice Money I build the Adhikari agent app and B2B portal (AePS, BBPS bill payments, eKYC and insurance)
        and the Travel Union booking platform.</p>
      <p>This portfolio is a Flutter Web app and needs JavaScript. You can also reach me by
        <a href="mailto:tushardubey121@gmail.com">email</a>, on
        <a href="https://www.linkedin.com/in/tushar-dubey715371125/">LinkedIn</a> or on
        <a href="https://github.com/tushardubey121">GitHub</a>.</p>
    </main>
  </noscript>

  <div id="splash" role="status" aria-live="polite" aria-label="Loading portfolio">
    <div class="splash-inner">
      <p class="splash-eyebrow">Flutter Engineer — Mumbai, India</p>
      <p class="splash-name">Tushar Dubey</p>
      <div class="splash-track" aria-hidden="true"><div class="splash-bar"></div></div>
    </div>
  </div>

  <script>
    (function () {
      var splash = document.getElementById('splash');
      if (!splash) return;

      function dismiss() {
        splash.classList.add('is-done');
        setTimeout(function () {
          if (splash.parentNode) splash.parentNode.removeChild(splash);
        }, 360);
      }

      window.addEventListener('flutter-first-frame', dismiss, { once: true });
      // Never leave the splash covering the page if the event is missed.
      setTimeout(function () {
        if (document.getElementById('splash')) dismiss();
      }, 12000);
    })();
  </script>

  <script src="flutter_bootstrap.js" async></script>
</body>
</html>
