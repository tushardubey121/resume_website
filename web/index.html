<!DOCTYPE html>
<html>
<head>
  <!--
    If you are serving your web app in a path other than the root, change the
    href value below to reflect the base path you are serving from.

    The path provided below has to start and end with a slash "/" in order for
    it to work correctly.

    For more details:
    * https://developer.mozilla.org/en-US/docs/Web/HTML/Element/base

    This is a placeholder for base href that will be replaced by the value of
    the `--base-href` argument provided to `flutter build`.
  -->
  <base href="$FLUTTER_BASE_HREF">

  <meta charset="UTF-8">
  <meta content="IE=Edge" http-equiv="X-UA-Compatible">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=5.0, viewport-fit=cover">
  <meta name="description" content="Tushar Dubey — Flutter developer and Associate Manager. Portfolio of shipped mobile apps and Flutter portal work.">
  <meta name="theme-color" content="#071A1C">

  <!-- iOS meta tags & icons -->
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black">
  <meta name="apple-mobile-web-app-title" content="Tushar Dubey">
  <link rel="apple-touch-icon" href="icons/Icon-192.png">

  <!-- Favicon -->
  <link rel="icon" type="image/png" href="favicon.png"/>

  <title>Tushar Dubey · Flutter Developer</title>
  <link rel="manifest" href="manifest.json">

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Figtree:wght@500;600&family=Fraunces:opsz,wght@9..144,600&display=swap" rel="stylesheet">

  <style>
    html, body {
      margin: 0;
      padding: 0;
      width: 100%;
      height: 100%;
      background: #071A1C;
      overflow: hidden;
      -webkit-text-size-adjust: 100%;
      touch-action: pan-y;
    }

    flutter-view, flt-glass-pane, canvas {
      width: 100% !important;
      height: 100% !important;
    }

    #splash {
      position: fixed;
      inset: 0;
      z-index: 9999;
      display: flex;
      align-items: center;
      justify-content: center;
      background:
        radial-gradient(ellipse 80% 60% at 78% 28%, rgba(20, 184, 166, 0.16), transparent 55%),
        radial-gradient(ellipse 70% 50% at 15% 70%, rgba(15, 118, 110, 0.14), transparent 50%),
        linear-gradient(145deg, #071A1C 0%, #0C2E32 35%, #123F42 72%, #0A2A2E 100%);
      transition: opacity 420ms ease, visibility 420ms ease;
    }

    #splash.is-done {
      opacity: 0;
      visibility: hidden;
      pointer-events: none;
    }

    .splash-inner {
      display: flex;
      flex-direction: column;
      align-items: center;
      text-align: center;
      padding: 24px;
      animation: splash-rise 700ms cubic-bezier(0.22, 1, 0.36, 1) both;
    }

    .splash-mono {
      font-family: "Fraunces", Georgia, serif;
      font-size: clamp(56px, 12vw, 88px);
      font-weight: 600;
      letter-spacing: -0.06em;
      line-height: 1;
      color: #FFFFFF;
      margin: 0;
    }

    .splash-rule {
      width: 40px;
      height: 2px;
      margin: 22px 0 18px;
      background: #2DD4BF;
      border-radius: 1px;
      transform-origin: center;
      animation: splash-rule 1.1s ease-in-out infinite alternate;
    }

    .splash-name {
      font-family: "Fraunces", Georgia, serif;
      font-size: clamp(18px, 4vw, 22px);
      font-weight: 600;
      letter-spacing: -0.02em;
      color: rgba(255, 255, 255, 0.92);
      margin: 0 0 8px;
    }

    .splash-tag {
      font-family: "Figtree", system-ui, sans-serif;
      font-size: 12px;
      font-weight: 600;
      letter-spacing: 0.18em;
      text-transform: uppercase;
      color: #7DD3C7;
      margin: 0 0 36px;
    }

    .splash-track {
      width: min(160px, 42vw);
      height: 2px;
      background: rgba(255, 255, 255, 0.12);
      border-radius: 2px;
      overflow: hidden;
    }

    .splash-bar {
      width: 40%;
      height: 100%;
      border-radius: 2px;
      background: linear-gradient(90deg, #14B8A6, #2DD4BF);
      animation: splash-slide 1.15s cubic-bezier(0.45, 0.05, 0.55, 0.95) infinite;
    }

    @keyframes splash-rise {
      from {
        opacity: 0;
        transform: translateY(18px);
      }
      to {
        opacity: 1;
        transform: translateY(0);
      }
    }

    @keyframes splash-rule {
      from { transform: scaleX(0.7); opacity: 0.7; }
      to { transform: scaleX(1); opacity: 1; }
    }

    @keyframes splash-slide {
      0% { transform: translateX(-120%); }
      100% { transform: translateX(320%); }
    }

    @media (prefers-reduced-motion: reduce) {
      .splash-inner,
      .splash-rule,
      .splash-bar {
        animation: none;
      }
    }
  </style>
</head>
<body>
  <div id="splash" aria-busy="true" aria-live="polite">
    <div class="splash-inner">
      <p class="splash-mono">TD</p>
      <div class="splash-rule" aria-hidden="true"></div>
      <p class="splash-name">Tushar Dubey</p>
      <p class="splash-tag">Flutter · Mobile · Leadership</p>
      <div class="splash-track" aria-hidden="true">
        <div class="splash-bar"></div>
      </div>
    </div>
  </div>

  <script>
    (function () {
      var splash = document.getElementById('splash');
      if (!splash) return;

      function dismiss() {
        splash.classList.add('is-done');
        splash.setAttribute('aria-busy', 'false');
        setTimeout(function () {
          if (splash && splash.parentNode) splash.parentNode.removeChild(splash);
        }, 480);
      }

      window.addEventListener('flutter-first-frame', dismiss, { once: true });

      // Fallback if the event never fires (rare edge cases)
      setTimeout(function () {
        if (document.getElementById('splash')) dismiss();
      }, 12000);
    })();
  </script>

  <script src="flutter_bootstrap.js" async></script>
</body>
</html>
